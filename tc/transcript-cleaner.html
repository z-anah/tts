<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcript Cleaner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <script defer src="transcript-cleaner.js"></script>
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center">
  <div class="bg-white dark:bg-gray-800 border dark:border-gray-700 rounded-lg p-8 shadow-md w-full max-w-md">
    <h1 class="text-2xl font-semibold mb-4 text-gray-900 dark:text-white flex items-center gap-2">
      <span class="material-symbols-outlined text-indigo-500">cleaning_services</span>
      Transcript Cleaner
    </h1>
    <form id="cleanerForm" class="space-y-4">
      <label for="cleanerInput" class="block text-gray-700 dark:text-gray-300 mb-1">Paste or edit transcript (Enter becomes space):</label>
      <textarea id="cleanerInput" rows="5" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-400 dark:bg-gray-900 dark:text-white dark:border-gray-700"></textarea>
      <div class="flex justify-between items-center">
        <span id="charCount" class="text-sm text-gray-500 dark:text-gray-400">0 characters</span>
        <button type="button" id="copyBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded transition-colors">Copy to Clipboard</button>
      </div>
    </form>
    <div id="copyStatus" class="mt-3 text-green-600 dark:text-green-400 text-center text-sm"></div>
  </div>
</body>
</html>
